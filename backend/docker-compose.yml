version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    
    volumes:
      - ./uploads:/app/uploads
    
    # DNS settings to ensure proper name resolution for SMTP servers
    dns:
      - 8.8.8.8
      - 8.8.4.4
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
